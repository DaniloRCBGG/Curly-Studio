<!doctype html>
<html lang="pt-BR">
  <body style="margin:0;padding:0;background:#f4efe9;font-family:'Segoe UI',Arial,sans-serif;color:#3d1c11;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4efe9;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;padding:40px 32px;">
            <tr>
              <td style="font-family:Georgia,serif;font-size:28px;color:#4a6b22;padding-bottom:4px;">Carol Rios</td>
            </tr>
            <tr>
              <td style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:#3d1c11;opacity:0.7;padding-bottom:28px;">Curly Studio</td>
            </tr>
            <tr>
              <td style="font-size:16px;line-height:1.6;padding-bottom:24px;">
                Oi! Que bom ter você por aqui.<br />
                Para ativar sua conta e agendar seus horários, confirme seu e-mail no botão abaixo.
              </td>
            </tr>
            <tr>
              <td align="center" style="padding-bottom:28px;">
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#4a6b22;color:#f4efe9;text-decoration:none;font-weight:600;padding:14px 32px;border-radius:999px;">Confirmar meu e-mail</a>
              </td>
            </tr>
            <tr>
              <td style="font-size:13px;line-height:1.6;color:#3d1c11;opacity:0.7;">
                Se você não criou uma conta no site do Curly Studio, é só ignorar este e-mail.
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
